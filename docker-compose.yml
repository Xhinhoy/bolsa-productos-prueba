services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bolsa
      POSTGRES_USER: bolsa
      POSTGRES_PASSWORD: secret
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bolsa"]
      interval: 5s
      retries: 10

  watermark:
    build: ./watermark-service
    environment:
      WATERMARK_OPACITY: "0.25"
      WATERMARK_SCALE: "0.5"
      MAX_PDF_MB: "10"
      MAX_IMAGE_MB: "2"
      MAX_PAGES: "500"
    ports: ["8001:8001"]
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request;urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 5s
      retries: 10

  app:
    build:
      context: ./app
      target: fpm
    depends_on:
      db: {condition: service_healthy}
      watermark: {condition: service_healthy}
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: "5432"
      DB_DATABASE: bolsa
      DB_USERNAME: bolsa
      DB_PASSWORD: secret
      SESSION_DRIVER: database
      WATERMARK_URL: http://watermark:8001
    volumes: [app_storage:/var/www/html/storage/app]

  nginx:
    build:
      context: ./app
      target: web
    depends_on: [app]
    ports: ["8080:80"]

volumes:
  pgdata:
  app_storage:
